{% extends "base.html" %}
{% block title %}{{ 'Editar' if paciente else 'Nuevo' }} paciente - MediControl{% endblock %}
{% block titulo %}{{ 'Editar paciente' if paciente else 'Nuevo paciente' }}{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
<form method="post" class="card panel"><div class="card-body">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required value="{{ paciente.nombre if paciente else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" required value="{{ paciente.telefono if paciente else '' }}">
    </div>
    <button class="btn btn-success"><i class="bi bi-check-lg"></i> Guardar</button>
    <a href="{{ url_for('pacientes.listar') }}" class="btn btn-secondary">Cancelar</a>
</div></form>
</div></div>
{% endblock %}
