<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MediControl{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilos.css') }}" rel="stylesheet">
</head>
<body>
<div class="d-flex">

    <aside class="sidebar offcanvas-md offcanvas-start text-bg-dark p-3" tabindex="-1" id="menuLateral">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="{{ url_for('index') }}" class="text-white text-decoration-none fs-4 fw-bold">
                 MediControl
            </a>
            <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#menuLateral"></button>
        </div>
        <ul class="nav nav-pills flex-column gap-1">
            <li><a class="nav-link {{ 'active' if request.endpoint == 'index' }}" href="{{ url_for('index') }}"> Panel</a></li>
            <li><a class="nav-link {{ 'active' if request.blueprint == 'medicos' }}" href="{{ url_for('medicos.listar') }}"> Médicos</a></li>
            <li><a class="nav-link {{ 'active' if request.blueprint == 'pacientes' }}" href="{{ url_for('pacientes.listar') }}">Pacientes</a></li>
            <li><a class="nav-link {{ 'active' if request.blueprint == 'citas' }}" href="{{ url_for('citas.listar') }}"> Citas</a></li>
        </ul>
    </aside>

    <div class="flex-grow-1 min-vw-0">
        <header class="topbar d-flex align-items-center px-4 py-3">
            <button class="btn btn-outline-secondary d-md-none me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="h4 mb-0">{% block titulo %}Panel{% endblock %}</h1>
        </header>

        <main class="p-4">
            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensaje in mensajes %}
                    <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                        {{ mensaje }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                {% endfor %}
            {% endwith %}

            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
